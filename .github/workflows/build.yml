# Сборка установщика в публичной CI: SignPath подписывает только собранное
# здесь, из этого репозитория. Тег v* дополнительно заводит черновик релиза
# с установщиком — публикует его человек, посмотрев.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Сайдкар датчиков — net472: SDK собирает его, Windows держит рантайм
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: npx tauri build

      # Тесты, требующие живого железа и прав, помечены #[ignore]
      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      - uses: actions/upload-artifact@v4
        with:
          name: windgets-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe

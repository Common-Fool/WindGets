# Сборка установщика в публичной CI: SignPath подписывает только собранное
# здесь, из этого репозитория. Тег v* дополнительно заводит черновик релиза
# с установщиком — публикует его человек, посмотрев.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Сборке и проверке хватает чтения. Право записи нужно только черновику
# выпуска, и оно выдано одному его заданию ниже.
#
# Сторонние Actions закреплены коммитом, а не тегом: тег переставляется, и
# подменённый выпуск чужого действия получил бы токен этой сборки. Версия —
# комментарием рядом; обновлять SHA вместе с ним.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Сайдкар датчиков — net472: SDK собирает его, Windows держит рантайм
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Регрессии фронта без Tauri: доставка событий окнам, очереди панелей,
      # отказы буфера, волна звука
      - name: Front regressions
        run: |
          node scripts/check-appearance.mjs
          node scripts/check-clipboard.mjs
          node scripts/check-wave.mjs
          node scripts/check-widget-panels.mjs

      - name: Build installer
        run: npx tauri build

      # Тесты, требующие живого железа и прав, помечены #[ignore]
      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windgets-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windgets-setup
          path: setup

      # Исходники MPL и LGPL рядом с выпуском: LGPL 2.1 §6(d) просит их
      # «из того же места», что и программу. Адреса и коммиты — из списка
      # лицензий. Коммит обязателен: архив HEAD со временем меняется и уже не
      # совпадал бы с тем, что вшито в выпуск
      - name: Third-party sources
        shell: pwsh
        run: |
          # Только часть 1 — сборки сайдкара; крейты MPL берутся с crates.io как есть
          $all = Get-Content THIRD-PARTY-NOTICES.txt -Raw
          $text = $all.Substring($all.IndexOf('PART 1.'), $all.IndexOf('PART 2.') - $all.IndexOf('PART 1.'))
          $pattern = 'License: (?:MPL-2\.0|LGPL-2\.1)\s+Source: https://github\.com/([^/\s]+)/([^/\s]+)(?=\s)(?: \(commit ([0-9a-f]{40})\))?'
          New-Item -ItemType Directory sources | Out-Null
          $seen = @{}
          foreach ($m in [regex]::Matches($text, $pattern)) {
            $owner = $m.Groups[1].Value; $repo = $m.Groups[2].Value
            if (-not $m.Groups[3].Success) { throw "у $owner/$repo в списке лицензий нет коммита" }
            $ref = $m.Groups[3].Value
            $key = "$owner/$repo@$ref"
            if ($seen.ContainsKey($key)) { continue }
            $seen[$key] = $true
            $tag = $ref.Substring(0, 7)
            Invoke-WebRequest "https://github.com/$owner/$repo/archive/$ref.zip" -OutFile "sources/$repo-$tag.zip"
          }
          Compress-Archive -Path sources/* -DestinationPath third-party-sources.zip

      - name: Draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          files: |
            setup/*.exe
            third-party-sources.zip
